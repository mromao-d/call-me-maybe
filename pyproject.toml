[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with a small LLM using constrained decoding"
readme = "README.md"
authors = [
    { name = "ManuelRomao", email = "romaog.manuel@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.mypy]
explicit_package_bases = true
exclude = ["llm_sdk/", ".venv/"]
